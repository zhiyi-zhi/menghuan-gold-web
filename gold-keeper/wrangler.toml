# 梦幻西游金币管家 · Cloudflare Pages 配置

name = "gold-keeper"
pages_build_output_dir = "./public"

# D1 数据库绑定
# 替换 <DATABASE_ID> 为 `wrangler d1 create gold-keeper-db` 的输出
[[d1_databases]]
binding = "DB"
database_name = "gold-keeper-db"
database_id = "<DATABASE_ID>"

# ========== 环境变量 ==========
# 登录密码（在前端登录界面输入）
# 方式1：直接在下面设置（简单但明文）
# [vars]
# ACCESS_PASSWORD = "你的密码"

# 方式2：通过 Cloudflare Pages 后台设置（推荐，更安全）
# Settings → Environment variables → Add variable
# 名称: ACCESS_PASSWORD
# 值: 你的密码
# 适用环境: Production / Preview / All environments

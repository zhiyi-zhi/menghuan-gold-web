# 梦幻西游金币管家 - Cloudflare 配置

name = "gold-keeper"
compatibility_date = "2026-01-21"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "gold-keeper-db"
database_id = "6e9bf781-1354-4937-910f-434315ece91a"

# Pages Functions 配置
[pages]
  # 构建输出目录
  build_output_dir = "public"
  
# 开发环境变量
[env.development.vars]
ENVIRONMENT = "development"

[env.production.vars]
ENVIRONMENT = "production"

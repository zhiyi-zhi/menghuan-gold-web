<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>梦幻西游 · 金币管家</title>

  <!-- ✅ 换回原来的 CDN（你之前能加载的版本） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Microsoft YaHei"', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
      color: #e2e8f0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .glass {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .nav-tab { transition: all 0.3s ease; }
    .nav-tab-active {
      border-bottom: 3px solid #a5b4fc;
      color: white;
      font-weight: 600;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white; font-weight: 600;
      transition: all 0.2s;
    }
    .btn-primary:hover { background: linear-gradient(135deg, #059669, #047857); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-indigo {
      background: #6366f1; color: white; font-weight: 600;
      transition: all 0.2s;
    }
    .btn-indigo:hover { background: #4f46e5; }
    .glass-modal {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; border-radius: 16px; font-size: 15px; z-index: 9999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      animation: slideUp 0.3s ease;
      display: flex; align-items: center; gap: 8px;
    }
    .toast-success { background: #10b981; color: white; }
    .toast-error { background: #ef4444; color: white; }
    @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .stat-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .table-row:hover { background: rgba(255,255,255,0.03); }

    /* ✅ 日变化颜色 */
    .change-up   { color: #34d399; font-weight: 600; }
    .change-down { color: #f87171; font-weight: 600; }
    .change-zero { color: #94a3b8; }

    /* 图表容器 */
    .chart-wrap { position: relative; height: 50vh; width: 100%; }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* 移动端适配 */
    @media (max-width: 640px) {
      .stat-card { padding: 12px !important; }
      .stat-card .text-2xl { font-size: 1.25rem !important; }
      .stat-card .text-lg { font-size: 0.95rem !important; }
    }

    /* 输入框文字颜色 */
    input, select { color: #e2e8f0; }
    input::placeholder { color: #64748b; }

    /* ✅ 表格表头居中 */
    .table-header th {
      text-align: center !important;
      font-weight: 500;
    }
    /* 表格内容也居中 */
    .table-center td {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="max-w-7xl mx-auto p-3 md:p-6">

    <!-- ========== 头部 ========== -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 md:mb-8">
      <div class="flex items-center gap-3 md:gap-4">
        <div class="w-12 h-12 md:w-14 md:h-14 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-2xl md:text-3xl shadow-lg">💰</div>
        <div>
          <h1 class="text-2xl md:text-4xl font-bold tracking-tight">梦幻西游金币管家</h1>
          <p class="text-slate-400 text-xs md:text-sm">每日记录 · 数据可视化 · 多账号管理</p>
        </div>
      </div>
      <button onclick="showQuickInput()"
              class="btn-primary flex items-center justify-center gap-2 md:gap-3 px-6 md:px-8 py-3 md:py-4 rounded-2xl md:rounded-3xl text-base md:text-lg shadow-xl whitespace-nowrap active:scale-95">
        <i class="fas fa-bolt"></i> ⚡ 快捷录入
      </button>
    </header>

    <!-- ========== 统计卡片 ========== -->
    <div id="statsBar" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-6 md:mb-8"></div>

    <!-- ========== Tab 导航 ========== -->
    <div class="flex flex-wrap gap-1 mb-6 md:mb-8 border-b border-slate-700 pb-1">
      <button onclick="switchTab(0)" id="tab0"
              class="nav-tab nav-tab-active px-4 md:px-8 py-3 md:py-4 rounded-t-2xl flex items-center gap-1 md:gap-2 text-sm md:text-lg flex-1 md:flex-none justify-center whitespace-nowrap">
        <i class="fas fa-chart-line"></i> <span class="hidden sm:inline">趋势图表</span><span class="sm:hidden">趋势</span>
      </button>
      <button onclick="switchTab(1)" id="tab1"
              class="nav-tab px-4 md:px-8 py-3 md:py-4 rounded-t-2xl flex items-center gap-1 md:gap-2 text-sm md:text-lg flex-1 md:flex-none justify-center whitespace-nowrap">
        <i class="fas fa-list"></i> <span class="hidden sm:inline">记录管理</span><span class="sm:hidden">记录</span>
      </button>
      <button onclick="switchTab(2)" id="tab2"
              class="nav-tab px-4 md:px-8 py-3 md:py-4 rounded-t-2xl flex items-center gap-1 md:gap-2 text-sm md:text-lg flex-1 md:flex-none justify-center whitespace-nowrap">
        <i class="fas fa-users"></i> <span class="hidden sm:inline">账号管理</span><span class="sm:hidden">账号</span>
      </button>
    </div>

    <!-- ========== Tab 0: 趋势图表（只有折线图，没有柱状图） ========== -->
    <div id="panel0">
      <div class="glass rounded-2xl md:rounded-3xl p-3 md:p-6 shadow-2xl">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
          <h2 class="text-lg md:text-xl font-semibold flex items-center gap-2">
            <i class="fas fa-chart-line text-indigo-400"></i> 金币变化趋势
          </h2>
          <button onclick="refreshChart()"
                  class="ml-auto px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm flex items-center gap-2">
            <i class="fas fa-sync"></i> 刷新
          </button>
        </div>
        <div class="chart-wrap bg-slate-950 rounded-2xl p-2 md:p-4">
          <canvas id="goldChart"></canvas>
        </div>
      </div>
    </div>

    <!-- ========== Tab 1: 记录管理 ========== -->
    <div id="panel1" style="display:none;">
      <div class="glass rounded-2xl md:rounded-3xl p-3 md:p-8 shadow-2xl">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
          <h2 class="text-lg md:text-xl font-semibold">全部记录</h2>
          <div class="flex gap-2 w-full md:w-auto">
            <select id="filterAccount" onchange="loadAllRecords()"
                    class="flex-1 md:flex-none bg-slate-800 border border-slate-600 rounded-2xl px-3 py-2 text-sm text-white">
              <option value="">全部账号</option>
            </select>
            <button onclick="loadAllRecords()"
                    class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-2xl flex items-center gap-1 text-sm whitespace-nowrap">
              <i class="fas fa-sync"></i> 刷新
            </button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full" id="recordsTable">
            <thead>
              <tr class="text-slate-400 border-b border-slate-700 text-sm table-header">
                <th class="py-3 px-2 font-normal">账号</th>
                <th class="py-3 px-2 font-normal">日期</th>
                <th class="py-3 px-2 font-normal">金币</th>
                <th class="py-3 px-2 font-normal">今日变化</th>
                <th class="py-3 px-2 font-normal">操作</th>
              </tr>
            </thead>
            <tbody class="text-slate-300 text-sm"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ========== Tab 2: 账号管理 ========== -->
    <div id="panel2" style="display:none;">
      <div class="glass rounded-2xl md:rounded-3xl p-3 md:p-8 shadow-2xl">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg md:text-xl font-semibold">账号列表</h2>
          <button onclick="showAddAccount()"
                  class="btn-indigo px-4 md:px-5 py-2 md:py-3 rounded-2xl flex items-center gap-2 text-sm md:text-base">
            <i class="fas fa-plus"></i> <span class="hidden sm:inline">新增账号</span><span class="sm:hidden">新增</span>
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full" id="accountsTable">
            <thead>
              <tr class="text-slate-400 border-b border-slate-700 text-sm table-header">
                <th class="py-3 px-2 font-normal">名称</th>
                <th class="py-3 px-2 font-normal hidden md:table-cell">服务器</th>
                <th class="py-3 px-2 font-normal hidden md:table-cell">角色</th>
                <th class="py-3 px-2 font-normal hidden lg:table-cell">备注</th>
                <th class="py-3 px-2 font-normal">最新/变化</th>
                <th class="py-3 px-2 font-normal w-20">操作</th>
              </tr>
            </thead>
            <tbody class="text-slate-300 text-sm"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 快捷录入弹窗 ========== -->
  <div id="quickModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-2 md:p-4">
    <div class="glass-modal rounded-2xl md:rounded-3xl p-5 md:p-10 w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <h2 class="text-xl md:text-2xl font-bold mb-5 flex items-center gap-2">
        <i class="fas fa-bolt text-yellow-400"></i> 快捷录入金币
      </h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">账号</label>
          <select id="quickAccountSelect"
                  class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-4 py-3 text-base text-white">
            <option value="">请选择账号</option>

        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">金币数量</label>
          <input id="quickGold" type="number"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-4 py-3 text-lg md:text-xl font-mono text-white"

        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">记录日期</label>
          <input id="quickDate" type="date"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-4 py-3 text-base text-white">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">备注（可选）</label>
          <input id="quickRemark" type="text"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-4 py-3 text-base text-white"
                 placeholder="如：日常任务">
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="hideQuickModal()"
                class="flex-1 py-3 rounded-2xl border border-slate-600 hover:bg-slate-800 text-sm md:text-base">取消</button>
        <button onclick="submitQuickInput()"

      </div>
    </div>
  </div>

  <!-- ========== 账号编辑弹窗 ========== -->
  <div id="accountModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-2 md:p-4">
    <div class="glass-modal rounded-2xl md:rounded-3xl p-5 md:p-10 w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <h2 id="accountModalTitle" class="text-xl md:text-2xl font-bold mb-5">新增账号</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">账号名称 *</label>
          <input id="accName" type="text"

        </div>

          <label class="block text-sm text-slate-400 mb-1">备注</label>
          <input id="accRemark" type="text"

        <button onclick="hideAccountModal()"

        <button onclick="submitAccount()"

  <!-- ========== 编辑记录弹窗 ========== -->
  <div id="recordModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-2 md:p-4">
    <div class="glass-modal rounded-2xl md:rounded-3xl p-5 md:p-10 w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <h2 class="text-xl md:text-2xl font-bold mb-5">编辑记录</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">账号</label>
          <select id="editAccountSelect"
                  class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-4 py-3 text-white"></select>
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">金币数量</label>
          <input id="editGold" type="number"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-4 py-3 text-lg font-mono text-white"
                 inputmode="numeric">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">日期</label>
          <input id="editDate" type="date"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-4 py-3 text-white">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">备注</label>
          <input id="editRemark" type="text"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-4 py-3 text-white">
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="hideRecordModal()"
                class="flex-1 py-3 rounded-2xl border border-slate-600 hover:bg-slate-800 text-sm md:text-base">取消</button>
        <button onclick="submitEditRecord()"
                class="flex-1 py-3 rounded-2xl btn-primary text-base md:text-lg">保存</button>
      </div>
    </div>
  </div>

  <!-- ========== JavaScript ========== -->
  <script>
    // ==================== 全局配置 ====================
    const GOAL = 1010000; // 目标金币
    const COLORS = [
      { border: '#6366f1', bg: 'rgba(99,102,241,0.15)' },
      { border: '#10b981', bg: 'rgba(16,185,129,0.15)' },
      { border: '#f59e0b', bg: 'rgba(245,158,11,0.15)' },
      { border: '#ef4444', bg: 'rgba(239,68,68,0.15)' },
      { border: '#06b6d4', bg: 'rgba(6,182,212,0.15)' },
      { border: '#ec4899', bg: 'rgba(236,72,153,0.15)' },
    ];

    // ==================== 全局状态 ====================
    let accountsCache = [];
    let allRecordsCache = [];
    let currentChart = null;
    let editingAccountId = null;
    let editingRecordId = null;

    // ==================== 工具函数 ====================

    /**
     * ✅ 核心：按「同账号」分组，每组内按日期排序，
     *    当前记录 - 上一条记录 = 日变化
     * 第一天没有"上一条"，change 设为 0
     */
    function calcDailyChangeByAccount(records) {
      // 1) 按账号分组
      const byAcc = {};
      records.forEach(r => {
        if (!byAcc[r.account_id]) byAcc[r.account_id] = [];
        byAcc[r.account_id].push(r);
      });

      // 2) 每组内按日期升序排序，逐条计算变化
      const result = [];
      Object.values(byAcc).forEach(group => {
        group.sort((a, b) => a.date.localeCompare(b.date));
        group.forEach((r, i) => {
          const prev = i > 0 ? group[i - 1].gold : null;
          const change = prev !== null ? r.gold - prev : 0;
          result.push({ ...r, change, prevGold: prev });
        });
      });

      return result;
    }

    /**
     * ✅ 格式化今日变化显示
     * + 增加 → 绿色 + 号
     * - 减少 → 红色 - 号
     * 0 / 第一天 → 灰色 0
     */
    function formatChange(val) {
      if (val === 0) {
        return '<span class="change-zero">0</span>';
      }
      if (val > 0) {
        return `<span class="change-up">+${val.toLocaleString()}</span>`;
      }
      return `<span class="change-down">${val.toLocaleString()}</span>`;
    }

    // ==================== API 封装 ====================
    async function api(path, options = {}) {
      const res = await fetch('/api' + path, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '请求失败');
      return data;
    }

    // ==================== Toast 提示 ====================
    function showToast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i> ${msg}`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // ==================== Tab 切换 ====================
    function switchTab(n) {
      for (let i = 0; i < 3; i++) {
        document.getElementById('tab' + i).classList.toggle('nav-tab-active', i === n);
        document.getElementById('panel' + i).style.display = i === n ? 'block' : 'none';
      }
      if (n === 0) setTimeout(refreshChart, 50);
      if (n === 1) loadAllRecords();
      if (n === 2) loadAccountsTable();
    }

    // ==================== 统计卡片 ====================
    async function loadStats() {
      try {
        if (allRecordsCache.length === 0) {
          const d = await api('/records');
          allRecordsCache = d.records || [];
        }

        // 每个账号只取最新一条
        const latestByAcc = {};
        allRecordsCache.forEach(r => {
          if (!latestByAcc[r.account_id] || r.date > latestByAcc[r.account_id].date) {
            latestByAcc[r.account_id] = r;
          }
        });
        const latestList = Object.values(latestByAcc);

        // 金币总量 = 所有角色最新金币之和
        const totalGold = latestList.reduce((s, r) => s + (r.gold || 0), 0);

        // 每个账号距目标 1010000 的差值
        const gapDetails = latestList.map(r => {
          const acc = accountsCache.find(a => a.id === r.account_id);
          const gap = GOAL - r.gold;
          return { name: acc?.name || '未知', current: r.gold, gap, reached: gap <= 0 };
        });

        // 距目标 HTML
        let gapHTML = '';
        if (gapDetails.length === 0) {
          gapHTML = '<span class="text-slate-500">暂无数据</span>';
        } else if (gapDetails.length === 1) {
          const g = gapDetails[0];
          gapHTML = g.reached
            ? `<span class="text-emerald-400 font-bold">✅ 已达标！超出 ${(-g.gap).toLocaleString()}</span>`
            : `还差 <span class="text-amber-400 font-bold">${g.gap.toLocaleString()}</span>`;
        } else {
          gapHTML = gapDetails.map(g => {
            const color = g.reached ? 'text-emerald-400' : 'text-amber-400';
            const txt = g.reached ? `✅ 达标` : `差 ${g.gap.toLocaleString()}`;
            return `<div class="text-xs md:text-sm ${color}">${g.name}: ${txt}</div>`;
          }).join('');
        }

        // 最近录入
        const sorted = [...allRecordsCache].sort((a, b) => b.date.localeCompare(a.date));
        const latest = sorted[0];
        const latestAcc = latest ? accountsCache.find(a => a.id === latest.account_id) : null;

        document.getElementById('statsBar').innerHTML = `
          <div class="stat-card rounded-2xl p-3 md:p-4">
            <div class="text-slate-400 text-xs mb-1">总记录数</div>
            <div class="text-xl md:text-2xl font-bold text-white">${allRecordsCache.length}</div>
          </div>
          <div class="stat-card rounded-2xl p-3 md:p-4">
            <div class="text-slate-400 text-xs mb-1">账号数量</div>
            <div class="text-xl md:text-2xl font-bold text-indigo-400">${accountsCache.length || latestList.length}</div>
          </div>
          <div class="stat-card rounded-2xl p-3 md:p-4">
            <div class="text-slate-400 text-xs mb-1">金币总量（最新）</div>
            <div class="text-xl md:text-2xl font-bold text-emerald-400">${totalGold.toLocaleString()}</div>
          </div>
          <div class="stat-card rounded-2xl p-3 md:p-4">
            <div class="text-slate-400 text-xs mb-1">距目标 ${GOAL.toLocaleString()}</div>
            <div class="mt-1">${gapHTML}</div>
          </div>
        `;
      } catch (e) {
        console.error('统计失败:', e);
      }
    }

    // ==================== 账号加载 ====================
    async function loadAccounts() {
      try {
        const data = await api('/accounts');
        accountsCache = data.accounts || [];

        const filterSel = document.getElementById('filterAccount');
        filterSel.innerHTML = '<option value="">全部账号</option>' +
          accountsCache.map(a => `<option value="${a.id}">${a.name}</option>`).join('');

        const quickSel = document.getElementById('quickAccountSelect');
        quickSel.innerHTML = '<option value="">请选择账号</option>' +
          accountsCache.map(a => `<option value="${a.id}">${a.name}</option>`).join('');

        const editSel = document.getElementById('editAccountSelect');
        if (editSel) {
          editSel.innerHTML = accountsCache.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
        }
      } catch (e) {
        showToast('加载账号失败: ' + e.message, 'error');
      }
    }

    // ==================== 快捷录入 ====================
    function showQuickInput() {
      document.getElementById('quickDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('quickGold').value = '';
      document.getElementById('quickRemark').value = '';
      document.getElementById('quickModal').classList.remove('hidden');
      loadAccounts();
    }
    function hideQuickModal() {
      document.getElementById('quickModal').classList.add('hidden');
    }

    async function submitQuickInput() {
      const accountId = document.getElementById('quickAccountSelect').value;
      const gold = parseInt(document.getElementById('quickGold').value);
      const date = document.getElementById('quickDate').value;
      const remark = document.getElementById('quickRemark').value.trim();

      if (!accountId) { showToast('请选择账号', 'error'); return; }
      if (isNaN(gold) || gold < 0) { showToast('请输入有效金币数', 'error'); return; }
      if (!date) { showToast('请选择日期', 'error'); return; }

      try {
        const result = await api('/records', {
          method: 'POST',
          body: JSON.stringify({ account_id: parseInt(accountId), gold, date, remark })
        });
        if (result.success !== false) {
          showToast('录入成功！');
          hideQuickModal();
          const d = await api('/records');
          allRecordsCache = d.records || [];
          refreshChart();
          loadStats();
          if (document.getElementById('panel1').style.display !== 'none') loadAllRecords();
        }
      } catch (e) {
        showToast('录入失败: ' + e.message, 'error');
      }
    }

    // ==================== 图表：折线图（唯一一张图） ====================
    async function refreshChart() {
      if (accountsCache.length === 0) await loadAccounts();
      if (allRecordsCache.length === 0) {
        try { const d = await api('/records'); allRecordsCache = d.records || []; } catch(e) {}
      }

      const allLabelsSet = new Set();
      const datasetsRaw = [];

      // 按账号分组
      const byAcc = {};
      allRecordsCache.forEach(r => {
        if (!byAcc[r.account_id]) byAcc[r.account_id] = [];
        byAcc[r.account_id].push(r);
      });

      let colorIdx = 0;
      for (const acc of accountsCache) {
        const records = (byAcc[acc.id] || []).sort((a, b) => a.date.localeCompare(b.date));
        if (records.length === 0) continue;

        records.forEach(r => allLabelsSet.add(r.date));
        const color = COLORS[colorIdx % COLORS.length];
        colorIdx++;

        datasetsRaw.push({
          label: acc.name,
          color,
          points: records.map(r => ({ date: r.date, gold: r.gold }))
        });
      }

      // 所有账号日期合并排序
      const allLabels = Array.from(allLabelsSet).sort();

      // 每个账号的数据对齐到统一 X 轴
      const datasets = datasetsRaw.map(ds => {
        const map = {};
        ds.points.forEach(p => map[p.date] = p.gold);
        return {
          label: ds.label,
          data: allLabels.map(d => map[d] ?? null),
          borderColor: ds.color.border,
          backgroundColor: ds.color.bg,
          borderWidth: 3,
          fill: true,
          tension: 0.3,
          pointRadius: window.innerWidth < 768 ? 3 : 5,
          pointHoverRadius: 7,
          spanGaps: true
        };
      });

      const canvas = document.getElementById('goldChart');
      const ctx = canvas.getContext('2d');
      if (currentChart) currentChart.destroy();

      if (datasets.length === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = '16px sans-serif';
        ctx.fillStyle = '#64748b';
        ctx.textAlign = 'center';
        ctx.fillText('暂无数据，先去录入吧！', canvas.width / 2, canvas.height / 2);
        return;
      }

      currentChart = new Chart(ctx, {
        type: 'line',
        data: { labels: allLabels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              labels: {
                color: '#e2e8f0',
                font: { size: window.innerWidth < 768 ? 11 : 13 },
                boxWidth: window.innerWidth < 768 ? 12 : 16
              }
            },
            tooltip: {
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y?.toLocaleString() || '无'} 金币`
              }
            }
          },
          scales: {
            x: {
              type: 'category',
              ticks: {
                color: '#94a3b8',
                maxRotation: 45, minRotation: 45,
                font: { size: window.innerWidth < 768 ? 10 : 12 },
                autoSkip: true,
                maxTicksLimit: window.innerWidth < 768 ? 6 : 12
              },
              grid: { color: 'rgba(255,255,255,0.05)' }
            },
            y: {
              ticks: {
                color: '#94a3b8',
                font: { size: window.innerWidth < 768 ? 10 : 12 },
                callback: v => v >= 10000 ? (v / 10000).toFixed(1) + '万' : v.toLocaleString()
              },
              grid: { color: 'rgba(255,255,255,0.05)' }
            }
          }
        }
      });
    }

    // ==================== 记录管理 ====================
    async function loadAllRecords() {
      const filterId = document.getElementById('filterAccount').value;
      const tbody = document.querySelector('#recordsTable tbody');
      tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>';

      try {
        let records = [];
        if (filterId) {
          records = (await api(`/records?account_id=${filterId}`)).records || [];
        } else {
          if (allRecordsCache.length === 0) {
            const d = await api('/records');
            allRecordsCache = d.records || [];
          }
          records = [...allRecordsCache];
        }

        if (records.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-slate-500">暂无记录</td></tr>';
          return;
        }

        // ✅ 按同账号分组计算日变化
        const enriched = calcDailyChangeByAccount(records);

        // 合并账号名
        enriched.forEach(r => {
          r.account_name = accountsCache.find(a => a.id === r.account_id)?.name || '未知';
        });

        // 按日期倒序（最新的在上面）
        enriched.sort((a, b) => b.date.localeCompare(a.date));

        tbody.innerHTML = enriched.map(r => `
          <tr class="table-row table-center border-b border-slate-800">
            <td class="py-2 px-2">${r.account_name}</td>
            <td class="py-2 px-2">${r.date}</td>
            <td class="py-2 px-2 font-mono">${r.gold.toLocaleString()}</td>
            <td class="py-2 px-2 font-mono font-semibold">${formatChange(r.change)}</td>
            <td class="py-2 px-2">
              <button onclick="showEditRecord(${r.id})" class="text-indigo-400 hover:text-indigo-300 mr-2"><i class="fas fa-edit"></i></button>
              <button onclick="deleteRecord(${r.id})" class="text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-red-400">加载失败: ${e.message}</td></tr>`;
      }
    }

    async function deleteRecord(id) {
      if (!confirm('确定删除这条记录？')) return;
      try {
        await api(`/records/${id}`, { method: 'DELETE' });
        showToast('已删除');
        allRecordsCache = allRecordsCache.filter(r => r.id !== id);
        loadAllRecords();
        refreshChart();
        loadStats();
      } catch (e) {
        showToast('删除失败: ' + e.message, 'error');
      }
    }

    async function showEditRecord(id) {
      try {
        const rec = allRecordsCache.find(r => r.id === id);
        if (!rec) { showToast('记录不存在', 'error'); return; }
        editingRecordId = id;
        await loadAccounts();
        document.getElementById('editAccountSelect').value = rec.account_id;
        document.getElementById('editGold').value = rec.gold;
        document.getElementById('editDate').value = rec.date;
        document.getElementById('editRemark').value = rec.remark || '';
        document.getElementById('recordModal').classList.remove('hidden');
      } catch (e) {
        showToast('加载记录失败: ' + e.message, 'error');
      }
    }
    function hideRecordModal() {
      document.getElementById('recordModal').classList.add('hidden');
      editingRecordId = null;
    }

    async function submitEditRecord() {
      const accountId = parseInt(document.getElementById('editAccountSelect').value);
      const gold = parseInt(document.getElementById('editGold').value);
      const date = document.getElementById('editDate').value;
      const remark = document.getElementById('editRemark').value.trim();

      if (!accountId || isNaN(gold) || !date) {
        showToast('请填写完整信息', 'error');
        return;
      }

      try {
        await api(`/records/${editingRecordId}`, {
          method: 'PUT',
          body: JSON.stringify({ account_id: accountId, gold, date, remark })
        });
        showToast('已更新');
        hideRecordModal();
        const idx = allRecordsCache.findIndex(r => r.id === editingRecordId);
        if (idx !== -1) {
          allRecordsCache[idx] = { ...allRecordsCache[idx], account_id: accountId, gold, date, remark };
        }
        loadAllRecords();
        refreshChart();
        loadStats();
      } catch (e) {
        showToast('更新失败: ' + e.message, 'error');
      }
    }

    // ==================== 账号管理 ====================
    async function loadAccountsTable() {
      const tbody = document.querySelector('#accountsTable tbody');
      tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-slate-500">加载中...</td></tr>';

      try {
        if (accountsCache.length === 0) await loadAccounts();
        if (accountsCache.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-slate-500">暂无账号</td></tr>';
          return;
        }

        // ✅ 每个账号：最新金币 + 与同账号上一条的变化
        const accStats = accountsCache.map(acc => {
          const recs = allRecordsCache
            .filter(r => r.account_id === acc.id)
            .sort((a, b) => a.date.localeCompare(b.date));
          const latest = recs.length > 0 ? recs[recs.length - 1] : null;
          const prev = recs.length > 1 ? recs[recs.length - 2] : null;
          const change = (latest && prev) ? latest.gold - prev.gold : 0;
          return { acc, latest, change };
        });

        tbody.innerHTML = accStats.map(({ acc, latest, change }) => {
          let changeHTML = '<span class="change-zero">0</span>';
          if (change > 0) changeHTML = `<span class="change-up">+${change.toLocaleString()}</span>`;
          else if (change < 0) changeHTML = `<span class="change-down">${change.toLocaleString()}</span>`;

          return `
          <tr class="table-row table-center border-b border-slate-800">
            <td class="py-2 px-2">${acc.name}</td>
            <td class="py-2 px-2 text-slate-400 hidden md:table-cell">${acc.server || '-'}</td>
            <td class="py-2 px-2 text-slate-400 hidden md:table-cell">${acc.role || '-'}</td>
            <td class="py-2 px-2 text-slate-400 hidden lg:table-cell">${acc.remark || '-'}</td>
            <td class="py-2 px-2">
              <div class="text-xs text-slate-300">${latest ? latest.gold.toLocaleString() + ' 金' : '-'}</div>
              <div class="text-xs font-semibold">${changeHTML}</div>
            </td>
            <td class="py-2 px-2">
              <button onclick="showEditAccount(${acc.id})" class="text-indigo-400 hover:text-indigo-300 mr-2"><i class="fas fa-edit"></i></button>
              <button onclick="deleteAccount(${acc.id})" class="text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        `;
        }).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-400">${e.message}</td></tr>`;
      }
    }

    function showAddAccount() {
      editingAccountId = null;
      document.getElementById('accountModalTitle').textContent = '新增账号';
      document.getElementById('accName').value = '';
      document.getElementById('accName').focus();
      document.getElementById('accServer').value = '';
      document.getElementById('accRole').value = '';
      document.getElementById('accRemark').value = '';
      document.getElementById('accountModal').classList.remove('hidden');
    }

    function showEditAccount(id) {
      const acc = accountsCache.find(a => a.id === id);
      if (!acc) return;
      editingAccountId = id;
      document.getElementById('accountModalTitle').textContent = '编辑账号';
      document.getElementById('accName').value = acc.name;
      document.getElementById('accServer').value = acc.server || '';
      document.getElementById('accRole').value = acc.role || '';
      document.getElementById('accRemark').value = acc.remark || '';
      document.getElementById('accountModal').classList.remove('hidden');
    }

    function hideAccountModal() {
      document.getElementById('accountModal').classList.add('hidden');
      editingAccountId = null;
    }

    async function submitAccount() {
      const name = document.getElementById('accName').value.trim();
      const server = document.getElementById('accServer').value.trim();
      const role = document.getElementById('accRole').value.trim();
      const remark = document.getElementById('accRemark').value.trim();

      if (!name) { showToast('请输入账号名称', 'error'); return; }

      try {
        if (editingAccountId) {
          await api(`/accounts/${editingAccountId}`, {
            method: 'PUT',
            body: JSON.stringify({ name, server, role, remark })
          });
          showToast('账号已更新');
        } else {
          await api('/accounts', {
            method: 'POST',
            body: JSON.stringify({ name, server, role, remark })
          });
          showToast('账号已创建');
        }
        hideAccountModal();
        await loadAccounts();
        loadAccountsTable();
        loadStats();
      } catch (e) {
        showToast('保存失败: ' + e.message, 'error');
      }
    }

    async function deleteAccount(id) {
      const acc = accountsCache.find(a => a.id === id);
      if (!confirm(`确定删除账号「${acc?.name}」？\n该账号下的所有金币记录也会被删除！`)) return;
      try {
        await api(`/accounts/${id}`, { method: 'DELETE' });
        showToast('账号已删除');
        await loadAccounts();
        loadAccountsTable();
        loadStats();
        refreshChart();
      } catch (e) {
        showToast('删除失败: ' + e.message, 'error');
      }
    }

    // ==================== 键盘快捷键 ====================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        hideQuickModal();
        hideAccountModal();
        hideRecordModal();
      }
    });

    // ==================== 初始化 ====================
    window.onload = async () => {
      await loadAccounts();
      try {
        const d = await api('/records');
        allRecordsCache = d.records || [];
      } catch(e) { console.error('初始化加载记录失败:', e); }
      await loadStats();
      switchTab(0);
    };
  </script>
</body>
</html>

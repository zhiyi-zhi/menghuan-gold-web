<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>梦幻西游手游 · 金币管家</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary: #67e8f9;
            --primary-dark: #22d3ee;
            --bg-1: #1e3a8a;
            --bg-2: #0f172a;
            --card: rgba(15, 23, 42, 0.88);
            --border: rgba(103, 232, 249, 0.25);
            --text: #e0f2fe;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #22d3ee;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px;
        }

        /* ── Header ── */
        header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 8px;
        }
        h1 {
            color: var(--primary);
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            letter-spacing: 1px;
        }
        .subtitle {
            color: #a5f3fc;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* ── 统计卡片 ── */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        @media (min-width: 640px) {
            .stats-bar { grid-template-columns: repeat(4, 1fr); }
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 12px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }
        .stat-card .value {
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: 700;
        }
        .stat-card .value.cyan { color: var(--primary); }
        .stat-card .value.green { color: #34d399; }
        .stat-card .value.amber { color: var(--warning); }
        .stat-card .value.white { color: #fff; }

        /* ── 账号栏 ── */
        .account-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            align-items: center;
        }
        .account-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            border-radius: 999px;
            cursor: pointer;
            color: var(--text);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all .2s;
        }
        .account-btn.active {
            background: var(--primary);
            color: #0f172a;
            font-weight: 700;
            border-color: transparent;
        }
        .account-btn:hover:not(.active) {
            background: rgba(103,232,249,0.18);
        }
        .account-btn .edit-icon {
            font-size: 0.75rem;
            opacity: 0.7;
        }
        .manage-btn {
            padding: 8px 14px;
            background: rgba(255,255,255,0.12);
            border: none;
            border-radius: 999px;
            color: var(--text);
            cursor: pointer;
            font-size: 0.85rem;
        }
        .manage-btn:hover { background: rgba(255,255,255,0.2); }

        /* ── Tab 导航 ── */
        .tabs {
            display: flex;
            background: rgba(15,23,42,0.8);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
            width: fit-content;
            max-width: 100%;
            overflow-x: auto;
        }
        .tab {
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            white-space: nowrap;
            transition: all .2s;
            color: var(--text-dim);
        }
        .tab.active {
            background: var(--primary-dark);
            color: #0f172a;
            font-weight: 700;
        }

        /* ── 卡片 ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
        }
        .card h2 {
            font-size: 1.15rem;
            margin-bottom: 14px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── 表单 ── */
        .input-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            align-items: end;
        }
        @media (min-width: 600px) {
            .input-group { grid-template-columns: 1fr 1fr auto; }
        }
        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: #1e2937;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border .2s;
        }
        input:focus, select:focus { border-color: var(--primary); }

        /* ── 按钮 ── */
        .btn {
            padding: 12px 28px;
            background: var(--primary-dark);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all .2s;
        }
        .btn:hover { background: var(--primary); transform: translateY(-1px); }
        .btn-danger { background: var(--danger); color: #fff; padding: 6px 12px; font-size: 0.85rem; }
        .btn-danger:hover { background: #f87171; }
        .btn-sm { padding: 8px 14px; font-size: 0.9rem; }

        /* ── 表格 ── */
        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 420px;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid rgba(103,232,249,0.15);
            font-size: 0.9rem;
        }
        th { color: var(--primary); font-weight: 600; font-size: 0.8rem; }
        td.num { text-align: right; font-family: "Cascadia Code", "Fira Code", monospace; }
        .change-up { color: #34d399; }
        .change-down { color: #f87171; }

        /* ── 图表 ── */
        .chart-container {
            position: relative;
            height: 55vh;
            min-height: 280px;
            max-height: 460px;
            width: 100%;
        }

        /* ── 概览卡片 ── */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
        }
        .summary-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            cursor: pointer;
            transition: all .2s;
        }
        .summary-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .summary-card .name { font-size: 1rem; color: var(--text-dim); }
        .summary-card .gold {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin: 8px 0;
        }
        .summary-card .meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        /* ── 弹窗 ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #1e2937;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h3 { margin-bottom: 16px; color: var(--primary); }
        .modal .form-row { margin-bottom: 12px; }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .modal-actions .btn { flex: 1; }
        .btn-cancel {
            background: rgba(255,255,255,0.1);
            color: var(--text);
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.95rem;
            z-index: 200;
            animation: slideDown .3s ease;
            max-width: 90vw;
        }
        .toast.success { background: #065f46; color: #d1fae5; }
        .toast.error { background: #991b1b; color: #fee2e2; }
        @keyframes slideDown {
            from { top: -40px; opacity: 0; }
            to { top: 20px; opacity: 1; }
        }

        /* ── 工具 ── */
        .row-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
        }
        .text-dim { color: var(--text-dim); }
        .select-inline {
            width: auto;
            min-width: 160px;
            padding: 8px 12px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 梦幻西游 · 金币管家</h1>
            <p class="subtitle">每日记录 · 数据可视化 · 多账号管理</p>
        </header>

        <!-- 统计卡片 -->
        <div class="stats-bar" id="statsBar"></div>

        <!-- 账号栏 -->
        <div class="account-bar" id="accountBar"></div>

        <!-- Tab 导航 -->
        <div class="tabs">
            <div class="tab active" data-tab="0">📊 数据概览</div>
            <div class="tab" data-tab="1">📝 记录金币</div>
            <div class="tab" data-tab="2">📈 变化趋势</div>
            <div class="tab" data-tab="3">👥 账号管理</div>
        </div>

        <!-- Tab 0: 概览 -->
        <div class="page" id="page0">
            <div class="summary-grid" id="summaryGrid"></div>
        </div>

        <!-- Tab 1: 录入 + 记录 -->
        <div class="page" id="page1" style="display:none;">
            <div class="card">
                <h2>⚡ 快捷录入金币</h2>
                <div class="input-group">
                    <div>
                        <label>选择账号</label>
                        <select id="quickAccount"></select>
                    </div>
                    <div>
                        <label>金币数量</label>
                        <input type="number" id="quickGold" placeholder="如：12345678">
                    </div>
                    <div>
                        <button class="btn" onclick="submitQuick()">确认录入</button>
                    </div>
                </div>
                <div class="input-group" style="margin-top:12px;">
                    <div>
                        <label>日期（默认今天）</label>
                        <input type="date" id="quickDate">
                    </div>
                    <div style="grid-column: 1 / -1;">
                        <label>备注（可选）</label>
                        <input type="text" id="quickRemark" placeholder="如：日常任务、副本等">
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="row-between">
                    <h2 style="margin:0;">📋 历史记录</h2>
                    <select class="select-inline" id="filterAccount" onchange="loadRecords()">
                        <option value="">全部账号</option>
                    </select>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>账号</th>
                                <th>日期</th>
                                <th class="num">金币</th>
                                <th>备注</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="recordBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Tab 2: 图表 -->
        <div class="page" id="page2" style="display:none;">
            <div class="card">
                <div class="row-between">
                    <h2 id="chartTitle" style="margin:0;">📈 金币变化趋势</h2>
                    <button class="btn btn-sm" onclick="renderChart()">🔄 刷新</button>
                </div>
                <div class="chart-container">
                    <canvas id="goldChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Tab 3: 账号管理 -->
        <div class="page" id="page3" style="display:none;">
            <div class="card">
                <div class="row-between">
                    <h2 style="margin:0;">👥 账号列表</h2>
                    <button class="btn btn-sm" onclick="showAddAccount()">+ 新增账号</button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>服务器</th>
                                <th>角色</th>
                                <th>备注</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="accountBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 账号编辑弹窗 -->
    <div class="modal-overlay" id="accountModal">
        <div class="modal">
            <h3 id="accountModalTitle">新增账号</h3>
            <div class="form-row">
                <label>账号名称 *</label>
                <input id="accName" placeholder="如：刘魔王">
            </div>
            <div class="form-row">
                <label>服务器</label>
                <input id="accServer" placeholder="如：北京一区">
            </div>
            <div class="form-row">
                <label>角色</label>
                <input id="accRole" placeholder="如：大唐官府">
            </div>
            <div class="form-row">
                <label>备注</label>
                <input id="accRemark" placeholder="可选">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="hideAccountModal()">取消</button>
                <button class="btn" onclick="submitAccount()">保存</button>
            </div>
        </div>
    </div>

    <!-- 编辑记录弹窗 -->
    <div class="modal-overlay" id="recordModal">
        <div class="modal">
            <h3>编辑记录</h3>
            <div class="form-row">
                <label>账号</label>
                <select id="editAccount"></select>
            </div>
            <div class="form-row">
                <label>金币数量</label>
                <input type="number" id="editGold">
            </div>
            <div class="form-row">
                <label>日期</label>
                <input type="date" id="editDate">
            </div>
            <div class="form-row">
                <label>备注</label>
                <input type="text" id="editRemark">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="hideRecordModal()">取消</button>
                <button class="btn" onclick="submitEditRecord()">保存</button>
            </div>
        </div>
    </div>

    <script>
    // ═══════════════════════════════════════════
    //  全局状态
    // ═══════════════════════════════════════════
    let accounts = [];          // 账号列表（从 API 加载）
    let currentAccountId = null; // 当前选中账号
    let chart = null;           // Chart.js 实例
    let editingAccountId = null;
    let editingRecordId = null;

    const API = {
        accounts: '/api/accounts',
        account:  id => `/api/accounts/${id}`,
        records:  '/api/records',
        record:   id => `/api/records/${id}`,
    };

    // ═══════════════════════════════════════════
    //  API 封装
    // ═══════════════════════════════════════════
    async function api(path, options = {}) {
        const res = await fetch(path, {
            headers: { 'Content-Type': 'application/json' },
            ...options,
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
            throw new Error(data.error || '请求失败');
        }
        return data;
    }

    // ═══════════════════════════════════════════
    //  Toast
    // ═══════════════════════════════════════════
    function toast(msg, type = 'success') {
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2800);
    }

    // ═══════════════════════════════════════════
    //  Tab 切换
    // ═══════════════════════════════════════════
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            const idx = tab.dataset.tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
            document.querySelectorAll('.page').forEach((p, i) => {
                p.style.display = i == idx ? 'block' : 'none';
            });
            // 延迟渲染，确保 canvas 尺寸正确
            setTimeout(() => {
                if (idx === '0') renderSummary();
                if (idx === '1') loadRecords();
                if (idx === '2') renderChart();
                if (idx === '3') loadAccountsTable();
            }, 50);
        });
    });

    function switchToTab(idx) {
        document.querySelector(`.tab[data-tab="${idx}"]`).click();
    }

    // ═══════════════════════════════════════════
    //  账号加载 & 渲染
    // ═══════════════════════════════════════════
    async function loadAccounts() {
        try {
            const data = await api(API.accounts);
            accounts = data.accounts || [];
            if (!currentAccountId && accounts.length > 0) {
                currentAccountId = accounts[0].id;
            }
            renderAccountBar();
            renderQuickSelect();
            renderFilterSelect();
            renderEditAccountSelect();
            renderStats();
        } catch (e) {
            toast('加载账号失败: ' + e.message, 'error');
        }
    }

    function renderAccountBar() {
        const bar = document.getElementById('accountBar');
        bar.innerHTML = '';
        accounts.forEach(acc => {
            const btn = document.createElement('button');
            btn.className = `account-btn ${acc.id === currentAccountId ? 'active' : ''}`;
            btn.innerHTML = `${acc.name} <span class="edit-icon" title="编辑">✏️</span>`;
            btn.onclick = (e) => {
                if (e.target.classList.contains('edit-icon')) {
                    e.stopPropagation();
                    showEditAccount(acc.id);
                } else {
                    currentAccountId = acc.id;
                    renderAccountBar();
                    renderStats();
                    // 如果当前在概览页，刷新
                    if (document.getElementById('page0').style.display !== 'none') renderSummary();
                }
            };
            bar.appendChild(btn);
        });
        const addBtn = document.createElement('button');
        addBtn.className = 'manage-btn';
        addBtn.textContent = '+ 新账号';
        addBtn.onclick = showAddAccount;
        bar.appendChild(addBtn);
    }

    function renderQuickSelect() {
        const sel = document.getElementById('quickAccount');
        sel.innerHTML = accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
        if (currentAccountId) sel.value = currentAccountId;
    }

    function renderFilterSelect() {
        const sel = document.getElementById('filterAccount');
        sel.innerHTML = '<option value="">全部账号</option>' +
            accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
    }

    function renderEditAccountSelect() {
        const sel = document.getElementById('editAccount');
        sel.innerHTML = accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
    }

    // ═══════════════════════════════════════════
    //  统计卡片
    // ═══════════════════════════════════════════
    async function renderStats() {
        try {
            const data = await api(API.records + '?limit=1000');
            const records = data.records || [];
            const totalRecords = records.length;
            const uniqueAccounts = new Set(records.map(r => r.account_id)).size;
            const totalGold = records.reduce((s, r) => s + (r.gold || 0), 0);
            const latest = records[0]; // API 已按 date DESC 排序
            const latestAcc = latest ? accounts.find(a => a.id === latest.account_id) : null;

            document.getElementById('statsBar').innerHTML = `
                <div class="stat-card">
                    <div class="label">总记录数</div>
                    <div class="value white">${totalRecords}</div>
                </div>
                <div class="stat-card">
                    <div class="label">账号数量</div>
                    <div class="value cyan">${uniqueAccounts}</div>
                </div>
                <div class="stat-card">
                    <div class="label">金币总量</div>
                    <div class="value green">${totalGold.toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <div class="label">最近录入</div>
                    <div class="value amber" style="font-size:1rem;">${latest ? (latestAcc?.name || '') + ' · ' + latest.date : '—'}</div>
                </div>
            `;
        } catch (e) {
            console.error('统计加载失败:', e);
        }
    }

    // ═══════════════════════════════════════════
    //  快捷录入
    // ═══════════════════════════════════════════
    function submitQuick() {
        const accountId = document.getElementById('quickAccount').value;
        const gold = parseInt(document.getElementById('quickGold').value);
        const date = document.getElementById('quickDate').value;
        const remark = document.getElementById('quickRemark').value.trim();

        if (!accountId) return toast('请选择账号', 'error');
        if (isNaN(gold) || gold < 0) return toast('请输入有效金币数', 'error');
        if (!date) return toast('请选择日期', 'error');

        api(API.records, {
            method: 'POST',
            body: JSON.stringify({ account_id: parseInt(accountId), gold, date, remark }),
        }).then(() => {
            toast('✅ 录入成功！');
            document.getElementById('quickGold').value = '';
            document.getElementById('quickRemark').value = '';
            renderStats();
            if (document.getElementById('page1').style.display !== 'none') loadRecords();
            if (document.getElementById('page2').style.display !== 'none') renderChart();
        }).catch(e => toast('录入失败: ' + e.message, 'error'));
    }

    // ═══════════════════════════════════════════
    //  记录管理
    // ═══════════════════════════════════════════
    async function loadRecords() {
        const filterId = document.getElementById('filterAccount').value;
        const tbody = document.getElementById('recordBody');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-dim);">加载中...</td></tr>';

        try {
            let url = API.records + '?limit=500';
            if (filterId) url += `&account_id=${filterId}`;
            const data = await api(url);
            const records = data.records || [];

            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-dim);">暂无记录</td></tr>';
                return;
            }

            // 计算每日变化（按账号分组）
            const byAcc = {};
            records.forEach(r => {
                if (!byAcc[r.account_id]) byAcc[r.account_id] = [];
                byAcc[r.account_id].push(r);
            });
            Object.values(byAcc).forEach(arr => {
                arr.sort((a, b) => a.date.localeCompare(b.date));
                arr.forEach((r, i) => {
                    r.change = i > 0 ? r.gold - arr[i - 1].gold : 0;
                });
            });

            tbody.innerHTML = records.map(r => {
                const acc = accounts.find(a => a.id === r.account_id);
                const changeHtml = r.change > 0
                    ? `<span class="change-up">+${r.change.toLocaleString()}</span>`
                    : r.change < 0
                    ? `<span class="change-down">${r.change.toLocaleString()}</span>`
                    : '<span class="text-dim">—</span>';
                return `
                    <tr>
                        <td>${acc?.name || '未知'}</td>
                        <td>${r.date}</td>
                        <td class="num">${r.gold.toLocaleString()}</td>
                        <td>${r.remark || '—'}</td>
                        <td>
                            <button class="btn btn-sm" style="margin-right:6px;padding:4px 10px;" onclick="showEditRecord(${r.id})">✏️</button>
                            <button class="btn-danger" onclick="deleteRecord(${r.id})">🗑</button>
                        </td>
                    </tr>
                `;
            }).join('');
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#f87171;">加载失败: ${e.message}</td></tr>`;
        }
    }

    async function deleteRecord(id) {
        if (!confirm('确定删除这条记录？')) return;
        try {
            await api(API.record(id), { method: 'DELETE' });
            toast('已删除');
            loadRecords();
            renderStats();
            if (document.getElementById('page2').style.display !== 'none') renderChart();
        } catch (e) {
            toast('删除失败: ' + e.message, 'error');
        }
    }

    // ═══════════════════════════════════════════
    //  编辑记录弹窗
    // ═══════════════════════════════════════════
    async function showEditRecord(id) {
        try {
            // 从当前列表中找到记录
            const filterId = document.getElementById('filterAccount').value;
            let url = API.records + '?limit=500';
            if (filterId) url += `&account_id=${filterId}`;
            const data = await api(url);
            const rec = (data.records || []).find(r => r.id === id);
            if (!rec) return toast('记录不存在', 'error');

            editingRecordId = id;
            document.getElementById('editAccount').value = rec.account_id;
            document.getElementById('editGold').value = rec.gold;
            document.getElementById('editDate').value = rec.date;
            document.getElementById('editRemark').value = rec.remark || '';
            document.getElementById('recordModal').classList.add('show');
        } catch (e) {
            toast('加载失败: ' + e.message, 'error');
        }
    }

    function hideRecordModal() {
        document.getElementById('recordModal').classList.remove('show');
        editingRecordId = null;
    }

    async function submitEditRecord() {
        const accountId = parseInt(document.getElementById('editAccount').value);
        const gold = parseInt(document.getElementById('editGold').value);
        const date = document.getElementById('editDate').value;
        const remark = document.getElementById('editRemark').value.trim();

        if (!accountId || isNaN(gold) || !date) return toast('请填写完整信息', 'error');

        try {
            await api(API.record(editingRecordId), {
                method: 'PUT',
                body: JSON.stringify({ account_id: accountId, gold, date, remark }),
            });
            toast('已更新');
            hideRecordModal();
            loadRecords();
            renderStats();
            if (document.getElementById('page2').style.display !== 'none') renderChart();
        } catch (e) {
            toast('更新失败: ' + e.message, 'error');
        }
    }

    // ═══════════════════════════════════════════
    //  账号管理弹窗
    // ═══════════════════════════════════════════
    function showAddAccount() {
        editingAccountId = null;
        document.getElementById('accountModalTitle').textContent = '新增账号';
        document.getElementById('accName').value = '';
        document.getElementById('accName').focus();
        document.getElementById('accServer').value = '';
        document.getElementById('accRole').value = '';
        document.getElementById('accRemark').value = '';
        document.getElementById('accountModal').classList.add('show');
    }

    function showEditAccount(id) {
        const acc = accounts.find(a => a.id === id);
        if (!acc) return;
        editingAccountId = id;
        document.getElementById('accountModalTitle').textContent = '编辑账号';
        document.getElementById('accName').value = acc.name;
        document.getElementById('accServer').value = acc.server || '';
        document.getElementById('accRole').value = acc.role || '';
        document.getElementById('accRemark').value = acc.remark || '';
        document.getElementById('accountModal').classList.add('show');
    }

    function hideAccountModal() {
        document.getElementById('accountModal').classList.remove('show');
        editingAccountId = null;
    }

    async function submitAccount() {
        const name = document.getElementById('accName').value.trim();
        const server = document.getElementById('accServer').value.trim();
        const role = document.getElementById('accRole').value.trim();
        const remark = document.getElementById('accRemark').value.trim();

        if (!name) return toast('请输入账号名称', 'error');

        try {
            if (editingAccountId) {
                await api(API.account(editingAccountId), {
                    method: 'PUT',
                    body: JSON.stringify({ name, server, role, remark }),
                });
                toast('账号已更新');
            } else {
                await api(API.accounts, {
                    method: 'POST',
                    body: JSON.stringify({ name, server, role, remark }),
                });
                toast('账号已创建');
            }
            hideAccountModal();
            await loadAccounts();
            if (document.getElementById('page3').style.display !== 'none') loadAccountsTable();
        } catch (e) {
            toast('保存失败: ' + e.message, 'error');
        }
    }

    async function deleteAccount(id) {
        const acc = accounts.find(a => a.id === id);
        if (!confirm(`确定删除账号「${acc?.name}」？\n该账号下所有金币记录也会被删除！`)) return;
        try {
            await api(API.account(id), { method: 'DELETE' });
            toast('账号已删除');
            if (currentAccountId === id) currentAccountId = null;
            await loadAccounts();
            if (document.getElementById('page3').style.display !== 'none') loadAccountsTable();
        } catch (e) {
            toast('删除失败: ' + e.message, 'error');
        }
    }

    async function loadAccountsTable() {
        const tbody = document.getElementById('accountBody');
        if (accounts.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-dim);">暂无账号</td></tr>';
            return;
        }
        tbody.innerHTML = accounts.map(a => `
            <tr>
                <td><strong>${a.name}</strong></td>
                <td>${a.server || '—'}</td>
                <td>${a.role || '—'}</td>
                <td>${a.remark || '—'}</td>
                <td>
                    <button class="btn btn-sm" style="margin-right:6px;padding:4px 10px;" onclick="showEditAccount(${a.id})">✏️</button>
                    <button class="btn-danger" onclick="deleteAccount(${a.id})">🗑</button>
                </td>
            </tr>
        `).join('');
    }

    // ═══════════════════════════════════════════
    //  概览卡片
    // ═══════════════════════════════════════════
    async function renderSummary() {
        const grid = document.getElementById('summaryGrid');
        if (accounts.length === 0) {
            grid.innerHTML = '<div class="empty-state">暂无账号，请先添加</div>';
            return;
        }

        try {
            // 并行加载所有账号的记录
            const allData = await Promise.all(
                accounts.map(a => api(API.records + `?account_id=${a.id}&limit=500`).catch(() => ({ records: [] })))
            );

            grid.innerHTML = accounts.map((acc, i) => {
                const recs = (allData[i].records || []).sort((a, b) => a.date.localeCompare(b.date));
                const latest = recs.length > 0 ? recs[recs.length - 1] : null; // ASC → last = latest
                const oldest = recs.length > 0 ? recs[0] : null;
                const change = (latest && oldest && recs.length > 1) ? latest.gold - oldest.gold : 0;
                const changeStr = change > 0 ? `+${change.toLocaleString()}` : change < 0 ? change.toLocaleString() : '—';

                return `
                    <div class="summary-card" onclick="currentAccountId=${acc.id}; renderAccountBar(); switchToTab(2);">
                        <div class="name">${acc.name}</div>
                        <div class="gold">${latest ? latest.gold.toLocaleString() : '0'}</div>
                        <div style="font-size:0.8rem;color:var(--text-dim);margin-bottom:8px;">
                            ${latest ? '📅 ' + latest.date : '尚无记录'}
                        </div>
                        <div class="meta">
                            <span>记录 ${recs.length} 天</span>
                            <span style="color:${change >= 0 ? '#34d399' : '#f87171'}">总变化 ${changeStr}</span>
                        </div>
                    </div>
                `;
            }).join('');
        } catch (e) {
            grid.innerHTML = `<div class="empty-state" style="color:#f87171;">加载失败: ${e.message}</div>`;
        }
    }

    // ═══════════════════════════════════════════
    //  ✅ Chart.js 图表（修复版）
    // ═══════════════════════════════════════════
    async function renderChart() {
        const canvas = document.getElementById('goldChart');
        const ctx = canvas.getContext('2d');

        // 销毁旧图表
        if (chart) { chart.destroy(); chart = null; }

        try {
            // 确定要画哪些账号
            const targetIds = currentAccountId
                ? [currentAccountId]
                : accounts.map(a => a.id);

            if (targetIds.length === 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            const colors = [
                { border: '#67e8f9', bg: 'rgba(103,232,249,0.15)' },
                { border: '#34d399', bg: 'rgba(52,211,153,0.15)' },
                { border: '#f59e0b', bg: 'rgba(245,158,11,0.15)' },
                { border: '#f87171', bg: 'rgba(248,113,113,0.15)' },
                { border: '#a78bfa', bg: 'rgba(167,139,250,0.15)' },
                { border: '#fb923c', bg: 'rgba(251,146,60,0.15)' },
            ];

            // 并行加载每个账号的数据
            const allData = await Promise.all(
                targetIds.map(id => api(API.records + `?account_id=${id}&limit=1000`).catch(() => ({ records: [] })))
            );

            // 收集所有日期（去重排序）
            const dateSet = new Set();
            allData.forEach(d => (d.records || []).forEach(r => dateSet.add(r.date)));
            const allDates = Array.from(dateSet).sort();

            if (allDates.length === 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#64748b';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据，先去录入吧！', canvas.width / 2, canvas.height / 2);
                return;
            }

            // 构建 datasets（labels 放在 data 层，不在 dataset 内）
            const datasets = allData.map((d, i) => {
                const acc = accounts.find(a => a.id === targetIds[i]);
                const recs = (d.records || []).sort((a, b) => a.date.localeCompare(b.date));
                const goldMap = {};
                recs.forEach(r => { goldMap[r.date] = r.gold; });

                const color = colors[i % colors.length];
                return {
                    label: acc?.name || '账号' + targetIds[i],
                    data: allDates.map(date => goldMap[date] ?? null),
                    borderColor: color.border,
                    backgroundColor: color.bg,
                    borderWidth: 2.5,
                    fill: true,
                    tension: 0.35,
                    pointRadius: 4,
                    pointHoverRadius: 7,
                    spanGaps: true, // 中间缺日期时连线
                };
            });

            const isMobile = window.innerWidth < 640;

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: allDates,   // ✅ labels 在 data 层
                    datasets: datasets,
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, // ✅ 必须，配合 chart-container 高度
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#e0f2fe',
                                font: { size: isMobile ? 11 : 13 },
                                boxWidth: isMobile ? 16 : 24,
                            },
                        },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    const v = ctx.parsed.y;
                                    return v == null ? `${ctx.dataset.label}: —` : `${ctx.dataset.label}: ${v.toLocaleString()} 金币`;
                                },
                            },
                        },
                    },
                    scales: {
                        x: {
                            type: 'category', // ✅ category 轴
                            ticks: {
                                color: '#94a3b8',
                                maxRotation: 45,
                                minRotation: 45,
                                font: { size: isMobile ? 10 : 12 },
                            },
                            grid: { color: 'rgba(103,232,249,0.08)' },
                        },
                        y: {
                            ticks: {
                                color: '#94a3b8',
                                font: { size: isMobile ? 10 : 12 },
                                callback: v => v >= 10000 ? (v / 10000).toFixed(1) + '万' : v.toLocaleString(),
                            },
                            grid: { color: 'rgba(103,232,249,0.08)' },
                        },
                    },
                },
            });
        } catch (e) {
            console.error('图表渲染失败:', e);
            toast('图表加载失败: ' + e.message, 'error');
        }
    }

    // ═══════════════════════════════════════════
    //  键盘 & 初始化
    // ═══════════════════════════════════════════
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            hideAccountModal();
            hideRecordModal();
        }
    });

    // 点击弹窗遮罩关闭
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', e => {
            if (e.target === overlay) overlay.classList.remove('show');
        });
    });

    async function init() {
        // 默认日期为今天
        document.getElementById('quickDate').value = new Date().toISOString().split('T')[0];
        await loadAccounts();
        renderSummary();
    }

    window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

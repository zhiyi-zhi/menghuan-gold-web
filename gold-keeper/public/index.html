<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>梦幻西游 · 金币管家</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Microsoft YaHei"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
    }
    .glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-modal {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .nav-tab { transition: all 0.3s ease; }
    .nav-tab-active {
      border-bottom: 4px solid #a5b4fc;
      color: white;
      font-weight: 600;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981, #0d9488);
      transition: all 0.2s;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -10px rgba(16,185,129,0.5); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-indigo {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      transition: all 0.2s;
    }
    .btn-indigo:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -10px rgba(99,102,241,0.5); }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #14b8a6;
      box-shadow: 0 0 0 3px rgba(20,184,166,0.1);
    }
    .table-row:hover { background: rgba(255,255,255,0.03); }
    .toast {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      padding: 16px 24px; border-radius: 16px; color: white; font-weight: 500;
      animation: slideIn 0.3s ease;
    }
    .toast-success { background: linear-gradient(135deg, #10b981, #059669); }
    .toast-error { background: linear-gradient(135deg, #ef4444, #dc2626); }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .stat-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.3s;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: rgba(165,180,252,0.3); }
  </style>
</head>
<body>
  <div class="max-w-7xl mx-auto p-4 md:p-6">
    <!-- 头部 -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 md:mb-10">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-3xl shadow-lg">
          💰
        </div>
        <div>
          <h1 class="text-3xl md:text-4xl font-bold tracking-tight">梦幻西游金币管家</h1>
          <p class="text-slate-400 text-sm md:text-base">每日记录 · 数据可视化 · 多账号管理</p>
        </div>
      </div>
      <button onclick="showQuickInput()"
              class="btn-primary flex items-center justify-center gap-3 px-8 py-4 rounded-3xl text-lg font-semibold shadow-xl">
        <i class="fas fa-bolt"></i>
        <span>⚡ 快捷录入</span>
      </button>
    </header>

    <!-- 统计卡片 -->
    <div id="statsBar" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>

    <!-- Tab 导航 -->
    <div class="flex gap-1 mb-8 border-b border-slate-700 pb-1 overflow-x-auto">
      <button onclick="switchTab(0)" id="tab0"
              class="nav-tab nav-tab-active px-6 md:px-8 py-4 rounded-t-2xl flex items-center gap-2 text-base md:text-lg whitespace-nowrap">
        <i class="fas fa-chart-line"></i> 趋势图表
      </button>
      <button onclick="switchTab(1)" id="tab1"
              class="nav-tab px-6 md:px-8 py-4 rounded-t-2xl flex items-center gap-2 text-base md:text-lg whitespace-nowrap">
        <i class="fas fa-list"></i> 记录管理
      </button>
      <button onclick="switchTab(2)" id="tab2"
              class="nav-tab px-6 md:px-8 py-4 rounded-t-2xl flex items-center gap-2 text-base md:text-lg whitespace-nowrap">
        <i class="fas fa-users"></i> 账号管理
      </button>
    </div>

    <!-- Tab 0: 趋势图表 -->
    <div id="panel0">
      <div class="glass rounded-3xl p-6 md:p-8 shadow-2xl">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
          <h2 class="text-xl md:text-2xl font-semibold flex items-center gap-3">
            <i class="fas fa-chart-line text-indigo-400"></i> 金币变化趋势
          </h2>
          <div class="flex gap-3 items-center">
            <select id="chartAccountSelect" multiple size="1"
                    class="bg-slate-800 text-white border border-slate-600 rounded-2xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500 min-w-[200px]">
            </select>
            <button onclick="refreshChart()"
                    class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm">
              <i class="fas fa-sync"></i> 刷新
            </button>
          </div>
        </div>
        <div class="bg-slate-950 rounded-2xl p-4">
          <canvas id="goldChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Tab 1: 记录管理 -->
    <div id="panel1" class="hidden">
      <div class="glass rounded-3xl p-6 md:p-8 shadow-2xl">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
          <h2 class="text-xl md:text-2xl font-semibold">全部记录</h2>
          <div class="flex gap-3">
            <select id="filterAccount" onchange="loadAllRecords()"
                    class="bg-slate-800 border border-slate-600 rounded-2xl px-4 py-3 text-sm">
              <option value="">全部账号</option>
            </select>
            <button onclick="loadAllRecords()"
                    class="px-5 py-3 bg-slate-700 hover:bg-slate-600 rounded-2xl flex items-center gap-2">
              <i class="fas fa-sync"></i> 刷新
            </button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full" id="recordsTable">
            <thead>
              <tr class="text-slate-400 border-b border-slate-700">
                <th class="py-4 text-left pl-4 font-normal">账号</th>
                <th class="py-4 text-left font-normal">日期</th>
                <th class="py-4 text-right font-normal">金币</th>
                <th class="py-4 text-left font-normal">备注</th>
                <th class="py-4 text-center font-normal w-28">操作</th>
              </tr>
            </thead>
            <tbody class="text-slate-300"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Tab 2: 账号管理 -->
    <div id="panel2" class="hidden">
      <div class="glass rounded-3xl p-6 md:p-8 shadow-2xl">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl md:text-2xl font-semibold">账号列表</h2>
          <button onclick="showAddAccount()"
                  class="btn-indigo px-5 py-3 rounded-2xl flex items-center gap-2 font-semibold">
            <i class="fas fa-plus"></i> 新增账号
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full" id="accountsTable">
            <thead>
              <tr class="text-slate-400 border-b border-slate-700">
                <th class="py-4 text-left pl-4 font-normal">名称</th>
                <th class="py-4 text-left font-normal">服务器</th>
                <th class="py-4 text-left font-normal">角色</th>
                <th class="py-4 text-left font-normal">备注</th>
                <th class="py-4 text-center font-normal w-28">操作</th>
              </tr>
            </thead>
            <tbody class="text-slate-300"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 快捷录入弹窗 -->
  <div id="quickModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
    <div class="glass-modal rounded-3xl p-8 md:p-10 w-full max-w-lg">
      <h2 class="text-2xl md:text-3xl font-bold mb-8 flex items-center gap-3">
        <i class="fas fa-bolt text-yellow-400"></i> 快捷录入金币
      </h2>
      <div class="space-y-5">
        <div>
          <label class="block text-sm text-slate-400 mb-2">账号</label>
          <select id="quickAccountSelect"
                  class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4 text-base">
            <option value="">请选择账号</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-2">金币数量</label>
          <input id="quickGold" type="number"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4 text-xl md:text-2xl font-mono"
                 placeholder="如：12345678">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-2">记录日期</label>
          <input id="quickDate" type="date"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4 text-base">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-2">备注（可选）</label>
          <input id="quickRemark" type="text"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4 text-base"
                 placeholder="如：日常任务、副本等">
        </div>
      </div>
      <div class="flex gap-4 mt-8">
        <button onclick="hideQuickModal()"
                class="flex-1 py-4 rounded-2xl border border-slate-600 hover:bg-slate-800 transition-colors">
          取消
        </button>
        <button onclick="submitQuickInput()"
                class="flex-1 py-4 rounded-2xl btn-primary font-semibold text-lg">
          确认录入
        </button>
      </div>
    </div>
  </div>

  <!-- 账号编辑弹窗 -->
  <div id="accountModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
    <div class="glass-modal rounded-3xl p-8 w-full max-w-lg">
      <h2 id="accountModalTitle" class="text-2xl font-bold mb-6">新增账号</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-2">账号名称 *</label>
          <input id="accName" type="text"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4"
                 placeholder="如：主号">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-2">服务器</label>
          <input id="accServer" type="text"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4"
                 placeholder="如：北京一区">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-2">角色</label>
          <input id="accRole" type="text"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4"
                 placeholder="如：大唐官府">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-2">备注</label>
          <input id="accRemark" type="text"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4"
                 placeholder="备注信息">
        </div>
      </div>
      <div class="flex gap-4 mt-8">
        <button onclick="hideAccountModal()"
                class="flex-1 py-4 rounded-2xl border border-slate-600 hover:bg-slate-800">
          取消
        </button>
        <button onclick="submitAccount()"
                class="flex-1 py-4 rounded-2xl btn-indigo font-semibold text-lg">
          保存
        </button>
      </div>
    </div>
  </div>

  <!-- 编辑记录弹窗 -->
  <div id="recordModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
    <div class="glass-modal rounded-3xl p-8 w-full max-w-lg">
      <h2 class="text-2xl font-bold mb-6">编辑记录</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-2">账号</label>
          <select id="editAccountSelect"
                  class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4">
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-2">金币数量</label>
          <input id="editGold" type="number"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4 text-xl font-mono">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-2">日期</label>
          <input id="editDate" type="date"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4">
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-2">备注</label>
          <input id="editRemark" type="text"
                 class="w-full bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4">
        </div>
      </div>
      <div class="flex gap-4 mt-8">
        <button onclick="hideRecordModal()"
                class="flex-1 py-4 rounded-2xl border border-slate-600 hover:bg-slate-800">
          取消
        </button>
        <button onclick="submitEditRecord()"
                class="flex-1 py-4 rounded-2xl btn-primary font-semibold text-lg">
          保存
        </button>
      </div>
    </div>
  </div>

  <script>
    // ========== 全局状态 ==========
    let accountsCache = [];
    let currentChart = null;
    let editingAccountId = null;
    let editingRecordId = null;

    // ========== API 封装 ==========
    async function api(path, options = {}) {
      const res = await fetch('/api' + path, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '请求失败');
      return data;
    }

    // ========== Toast 提示 ==========
    function showToast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i> ${msg}`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // ========== Tab 切换 ==========
    function switchTab(n) {
      for (let i = 0; i < 3; i++) {
        document.getElementById('tab' + i).classList.toggle('nav-tab-active', i === n);
        document.getElementById('panel' + i).classList.toggle('hidden', i !== n);
      }
      if (n === 0) setTimeout(refreshChart, 100);
      if (n === 1) loadAllRecords();
      if (n === 2) loadAccountsTable();
    }

    // ========== 统计卡片 ==========
    async function loadStats() {
      try {
        const data = await api('/records');
        const records = data.records || [];
        const bar = document.getElementById('statsBar');

        // 计算统计
        const totalRecords = records.length;
        const uniqueAccounts = new Set(records.map(r => r.account_id)).size;
        const totalGold = records.reduce((sum, r) => sum + (r.gold || 0), 0);

        // 最近一次记录
        const latest = records.length > 0 ? records[0] : null;
        const latestAccount = latest ? accountsCache.find(a => a.id === latest.account_id) : null;

        bar.innerHTML = `
          <div class="stat-card rounded-2xl p-4">
            <div class="text-slate-400 text-xs mb-1">总记录数</div>
            <div class="text-2xl font-bold text-white">${totalRecords}</div>
          </div>
          <div class="stat-card rounded-2xl p-4">
            <div class="text-slate-400 text-xs mb-1">账号数量</div>
            <div class="text-2xl font-bold text-indigo-400">${uniqueAccounts}</div>
          </div>
          <div class="stat-card rounded-2xl p-4">
            <div class="text-slate-400 text-xs mb-1">金币总量</div>
            <div class="text-2xl font-bold text-emerald-400">${totalGold.toLocaleString()}</div>
          </div>
          <div class="stat-card rounded-2xl p-4">
            <div class="text-slate-400 text-xs mb-1">最近录入</div>
            <div class="text-lg font-semibold text-amber-400">${latest ? (latestAccount?.name || '') + ' ' + latest.date : '-'}</div>
          </div>
        `;
      } catch (e) {
        console.error('加载统计失败:', e);
      }
    }

    // ========== 账号加载 ==========
    async function loadAccounts() {
      try {
        const data = await api('/accounts');
        accountsCache = data.accounts || [];

        // 更新图表下拉
        const chartSel = document.getElementById('chartAccountSelect');
        chartSel.innerHTML = accountsCache.map(a =>
          `<option value="${a.id}" selected>${a.name}</option>`
        ).join('');

        // 更新筛选下拉
        const filterSel = document.getElementById('filterAccount');
        filterSel.innerHTML = '<option value="">全部账号</option>' +
          accountsCache.map(a => `<option value="${a.id}">${a.name}</option>`).join('');

        // 更新快捷录入下拉
        const quickSel = document.getElementById('quickAccountSelect');
        quickSel.innerHTML = '<option value="">请选择账号</option>' +
          accountsCache.map(a => `<option value="${a.id}">${a.name}</option>`).join('');

        // 更新编辑记录下拉
        const editSel = document.getElementById('editAccountSelect');
        if (editSel) {
          editSel.innerHTML = accountsCache.map(a =>
            `<option value="${a.id}">${a.name}</option>`
          ).join('');
        }
      } catch (e) {
        showToast('加载账号失败: ' + e.message, 'error');
      }
    }

    // ========== 快捷录入 ==========
    function showQuickInput() {
      document.getElementById('quickDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('quickGold').value = '';
      document.getElementById('quickRemark').value = '';
      document.getElementById('quickModal').classList.remove('hidden');
      // 刷新下拉（可能新增了账号）
      loadAccounts();
    }
    function hideQuickModal() {
      document.getElementById('quickModal').classList.add('hidden');
    }

    async function submitQuickInput() {
      const accountId = document.getElementById('quickAccountSelect').value;
      const gold = parseInt(document.getElementById('quickGold').value);
      const date = document.getElementById('quickDate').value;
      const remark = document.getElementById('quickRemark').value.trim();

      if (!accountId) { showToast('请选择账号', 'error'); return; }
      if (isNaN(gold) || gold < 0) { showToast('请输入有效金币数', 'error'); return; }
      if (!date) { showToast('请选择日期', 'error'); return; }

      try {
        const result = await api('/records', {
          method: 'POST',
          body: JSON.stringify({ account_id: parseInt(accountId), gold, date, remark })
        });
        if (result.success) {
          showToast('录入成功！');
          hideQuickModal();
          refreshChart();
          loadStats();
          // 如果在记录管理页也刷新
          if (!document.getElementById('panel1').classList.contains('hidden')) {
            loadAllRecords();
          }
        }
      } catch (e) {
        showToast('录入失败: ' + e.message, 'error');
      }
    }

    // ========== 图表 ==========
    // ========== 图表 ==========
async function refreshChart() {
  if (accountsCache.length === 0) return;

  const sel = document.getElementById('chartAccountSelect');
  const selected = Array.from(sel.selectedOptions).map(o => parseInt(o.value));
  const ids = selected.length > 0 ? selected : accountsCache.map(a => a.id);

  const allDatasets = [];
  const colors = [
    { border: '#6366f1', bg: 'rgba(99,102,241,0.15)' },
    { border: '#10b981', bg: 'rgba(16,185,129,0.15)' },
    { border: '#f59e0b', bg: 'rgba(245,158,11,0.15)' },
    { border: '#ef4444', bg: 'rgba(239,68,68,0.15)' },
    { border: '#06b6d4', bg: 'rgba(6,182,212,0.15)' },
    { border: '#ec4899', bg: 'rgba(236,72,153,0.15)' },
  ];

  for (let i = 0; i < ids.length; i++) {
    const id = ids[i];
    try {
      const data = await api(`/records?account_id=${id}`);
      const records = data.records || [];
      const acc = accountsCache.find(a => a.id === id);

      if (records.length === 0) continue;

      const color = colors[i % colors.length];
      
      const recordsSorted = records.sort((a, b) => new Date(a.date) - new Date(b.date));
      // ✅ 关键修复：使用 labels + data 格式，适配 category 轴
      allDatasets.push({
        label: acc?.name || '账号' + id,
        labels: recordsSorted.map(r => r.date), // ✅ 必须提供 labels 给 X 轴
        data: recordsSorted.map(r => r.gold),   // ✅ 必须提供纯数字数组给 Y 轴
        borderColor: color.border,
        backgroundColor: color.bg,
        borderWidth: 3,
        fill: true,
        tension: 0.3,
        pointRadius: 4,
        pointHoverRadius: 7
      });
    } catch (e) {
      console.error(`加载账号 ${id} 数据失败:`, e);
    }
  }

  const ctx = document.getElementById('goldChart').getContext('2d');
  if (currentChart) currentChart.destroy();

  if (allDatasets.length === 0) {
    ctx.font = '16px sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.textAlign = 'center';
    ctx.fillText('暂无数据，先去录入吧！', ctx.canvas.width / 2, ctx.canvas.height / 2);
    return;
  }

  currentChart = new Chart(ctx, {
    type: 'line',
    data: { datasets: allDatasets },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#e2e8f0', font: { size: 13 } } },
        tooltip: {
          callbacks: { label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()} 金币` }
        }
      },
      // ✅ 关键修复：改为 category，并移除 time 配置
      scales: {
        x: {
          type: 'category', // 不再使用 time
          ticks: { color: '#94a3b8' },
          grid: { color: 'rgba(255,255,255,0.05)' }
        },
        y: {
          ticks: {
            color: '#94a3b8',
            callback: v => v >= 10000 ? (v / 10000).toFixed(1) + '万' : v.toLocaleString()
          },
          grid: { color: 'rgba(255,255,255,0.05)' }
        }
      }
    }
  });
}

    // ========== 记录管理 ==========
    async function loadAllRecords() {
      const filterId = document.getElementById('filterAccount').value;
      const tbody = document.querySelector('#recordsTable tbody');
      tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>';

      try {
        let records = [];
        if (filterId) {
          const data = await api(`/records?account_id=${filterId}`);
          records = data.records || [];
        } else {
          const data = await api('/records');
          records = data.records || [];
        }

        if (records.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-slate-500">暂无记录</td></tr>';
          return;
        }

        // 合并账号名
        records.forEach(r => {
          const acc = accountsCache.find(a => a.id === r.account_id);
          r.account_name = acc?.name || '未知';
        });

        tbody.innerHTML = records.map(r => `
          <tr class="table-row border-b border-slate-800">
            <td class="py-3 pl-4 font-medium">${r.account_name}</td>
            <td class="py-3">${r.date}</td>
            <td class="py-3 text-right font-mono">${r.gold.toLocaleString()}</td>
            <td class="py-3 text-slate-400">${r.remark || '-'}</td>
            <td class="py-3 text-center">
              <button onclick="showEditRecord(${r.id})" class="text-indigo-400 hover:text-indigo-300 mr-3" title="编辑">
                <i class="fas fa-edit"></i>
              </button>
              <button onclick="deleteRecord(${r.id})" class="text-red-400 hover:text-red-300" title="删除">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-red-400">加载失败: ${e.message}</td></tr>`;
      }
    }

    // ========== 删除记录 ==========
    async function deleteRecord(id) {
      if (!confirm('确定删除这条记录？')) return;
      try {
        await api(`/records/${id}`, { method: 'DELETE' });
        showToast('已删除');
        loadAllRecords();
        refreshChart();
        loadStats();
      } catch (e) {
        showToast('删除失败: ' + e.message, 'error');
      }
    }

    // ========== 编辑记录 ==========
    async function showEditRecord(id) {
      try {
        // 找到记录数据
        const filterId = document.getElementById('filterAccount').value;
        let records = [];
        if (filterId) {
          const data = await api(`/records?account_id=${filterId}`);
          records = data.records || [];
        } else {
          const data = await api('/records');
          records = data.records || [];
        }
        const rec = records.find(r => r.id === id);
        if (!rec) { showToast('记录不存在', 'error'); return; }

        editingRecordId = id;
        await loadAccounts(); // 确保下拉有数据

        document.getElementById('editAccountSelect').value = rec.account_id;
        document.getElementById('editGold').value = rec.gold;
        document.getElementById('editDate').value = rec.date;
        document.getElementById('editRemark').value = rec.remark || '';

        document.getElementById('recordModal').classList.remove('hidden');
      } catch (e) {
        showToast('加载记录失败: ' + e.message, 'error');
      }
    }

    function hideRecordModal() {
      document.getElementById('recordModal').classList.add('hidden');
      editingRecordId = null;
    }

    async function submitEditRecord() {
      const accountId = parseInt(document.getElementById('editAccountSelect').value);
      const gold = parseInt(document.getElementById('editGold').value);
      const date = document.getElementById('editDate').value;
      const remark = document.getElementById('editRemark').value.trim();

      if (!accountId || isNaN(gold) || !date) {
        showToast('请填写完整信息', 'error');
        return;
      }

      try {
        await api(`/records/${editingRecordId}`, {
          method: 'PUT',
          body: JSON.stringify({ account_id: accountId, gold, date, remark })
        });
        showToast('已更新');
        hideRecordModal();
        loadAllRecords();
        refreshChart();
      } catch (e) {
        showToast('更新失败: ' + e.message, 'error');
      }
    }

    // ========== 账号管理 ==========
    async function loadAccountsTable() {
      const tbody = document.querySelector('#accountsTable tbody');
      tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>';

      try {
        if (accountsCache.length === 0) await loadAccounts();

        if (accountsCache.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-slate-500">暂无账号，点击右上角新增</td></tr>';
          return;
        }

        tbody.innerHTML = accountsCache.map(a => `
          <tr class="table-row border-b border-slate-800">
            <td class="py-3 pl-4 font-medium">${a.name}</td>
            <td class="py-3 text-slate-400">${a.server || '-'}</td>
            <td class="py-3 text-slate-400">${a.role || '-'}</td>
            <td class="py-3 text-slate-400">${a.remark || '-'}</td>
            <td class="py-3 text-center">
              <button onclick="showEditAccount(${a.id})" class="text-indigo-400 hover:text-indigo-300 mr-3" title="编辑">
                <i class="fas fa-edit"></i>
              </button>
              <button onclick="deleteAccount(${a.id})" class="text-red-400 hover:text-red-300" title="删除">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-red-400">加载失败: ${e.message}</td></tr>`;
      }
    }

    function showAddAccount() {
      editingAccountId = null;
      document.getElementById('accountModalTitle').textContent = '新增账号';
      document.getElementById('accName').value = '';
      document.getElementById('accName').focus();
      document.getElementById('accServer').value = '';
      document.getElementById('accRole').value = '';
      document.getElementById('accRemark').value = '';
      document.getElementById('accountModal').classList.remove('hidden');
    }

    function showEditAccount(id) {
      const acc = accountsCache.find(a => a.id === id);
      if (!acc) return;

      editingAccountId = id;
      document.getElementById('accountModalTitle').textContent = '编辑账号';
      document.getElementById('accName').value = acc.name;
      document.getElementById('accServer').value = acc.server || '';
      document.getElementById('accRole').value = acc.role || '';
      document.getElementById('accRemark').value = acc.remark || '';
      document.getElementById('accountModal').classList.remove('hidden');
    }

    function hideAccountModal() {
      document.getElementById('accountModal').classList.add('hidden');
      editingAccountId = null;
    }

    async function submitAccount() {
      const name = document.getElementById('accName').value.trim();
      const server = document.getElementById('accServer').value.trim();
      const role = document.getElementById('accRole').value.trim();
      const remark = document.getElementById('accRemark').value.trim();

      if (!name) { showToast('请输入账号名称', 'error'); return; }

      try {
        if (editingAccountId) {
          await api(`/accounts/${editingAccountId}`, {
            method: 'PUT',
            body: JSON.stringify({ name, server, role, remark })
          });
          showToast('账号已更新');
        } else {
          await api('/accounts', {
            method: 'POST',
            body: JSON.stringify({ name, server, role, remark })
          });
          showToast('账号已创建');
        }
        hideAccountModal();
        await loadAccounts();
        loadAccountsTable();
        loadStats();
      } catch (e) {
        showToast('保存失败: ' + e.message, 'error');
      }
    }

    async function deleteAccount(id) {
      const acc = accountsCache.find(a => a.id === id);
      if (!confirm(`确定删除账号「${acc?.name}」？\n该账号下的所有金币记录也会被删除！`)) return;

      try {
        await api(`/accounts/${id}`, { method: 'DELETE' });
        showToast('账号已删除');
        await loadAccounts();
        loadAccountsTable();
        loadStats();
      } catch (e) {
        showToast('删除失败: ' + e.message, 'error');
      }
    }

    // ========== 键盘快捷键 ==========
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        hideQuickModal();
        hideAccountModal();
        hideRecordModal();
      }
    });

    // ========== 初始化 ==========
    window.onload = async () => {
      await loadAccounts();
      await loadStats();
      switchTab(0);
    };
  </script>
</body>
</html>
